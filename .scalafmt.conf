version = "3.11.0"
runner.dialect = scala3

# Line length (Section 1)
maxColumn = 100

# Indentation (Section 1)
indent.main = 2
indent.defnSite = 2
indent.callSite = 2
indent.ctrlSite = 2
indent.extendSite = 2

# Trailing commas (Section 1)
trailingCommas = always

# Imports (Section 6)
rewrite.rules = [SortImports, SortModifiers, RedundantBraces]
rewrite.sortModifiers.order = [
  "override", "private", "protected", "final",
  "sealed", "abstract", "implicit", "lazy"
]

# Newlines
newlines.afterCurlyLambdaParams = squash
newlines.beforeCurlyLambdaParams = multilineWithCaseOnly
newlines.topLevelStatementBlankLines = [
  { blanks = 1 }
]

# Alignment
align.preset = more
align.openParenCallSite = false
align.openParenDefnSite = false

# Operator chaining (Section 5)
includeCurlyBraceInSelectChains = true
includeNoParensInSelectChains = true

# Excluded files (Adoption Policy)
project.excludeFilters = [
  "scalawind\\.scala$"
]
